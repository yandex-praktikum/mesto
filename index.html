<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./pages/index.css">
    <title>Mesto</title>
</head>
<body>
    <div class="page">
        <header class="header">
            <img src="../mesto/images/mestowhite.svg" alt="логотип" class="header__logo">
        </header>
        <main class="content">
            <section class="profile">
                <img src="../mesto/images/kusto.jpg" alt="Кусто" class="profile__image">
                 <div class="inline-block"><h1 class="profile__title">Жак-Ив Кусто</h1>
                <img src="images/editor.png" class="profile__edit">
                </div>
                
                <p class="profile__subtitle">Исследователь океана</p>
                <button class="profile__addbutton">+</button>
            </section>
            <section class="blocks">
                <ul class="cards">
                    <li class="cards__block">
                        <img src="../mesto/images/kara4aevsk.jpg" alt="PLACEHOLDER" class="cards__image">
                        <p class="cards__title">Карачаевск</p>
                        <button class="cards__button likebutton"><img src="../mesto/images/likenohover.svg"></button>
                    </li>
                    <li class="cards__block">
                        <img src="../mesto/images/elbrus.png" alt="PLACEHOLDER" class="cards__image">
                        <p class="cards__title">Домбай</p>
                        <button class="cards__button likebutton"><img src="../mesto/images/likenohover.svg"></button>
                    </li>
                    <li class="cards__block">
                        <img src="../mesto/images/dombi.png" alt="PLACEHOLDER" class="cards__image">
                        <p class="cards__title">Гора Эльбрус</p>
                        <button class="cards__button likebutton"><img src="../mesto/images/likenohover.svg"></button>
                    </li>
                    <li class="cards__block">
                        <img src="../mesto/images/elbrus.png" alt="PLACEHOLDER" class="cards__image">
                        <p class="cards__title">Домбай</p>
                        <button class="cards__button likebutton"><img src="../mesto/images/likenohover.svg"></button>
                    </li>
                    <li class="cards__block">
                        <img src="../mesto/images/dombi.png" alt="PLACEHOLDER" class="cards__image">
                        <p class="cards__title">Гора Эльбрус</p>
                        <button class="cards__button likebutton"><img src="../mesto/images/likenohover.svg"></button>
                    </li>
                    <li class="cards__block">
                        <img src="../mesto/images/kara4aevsk.jpg" alt="PLACEHOLDER" class="cards__image">
                        <p class="cards__title">Карачаевск</p>
                        <button class="cards__button likebutton"><img src="../mesto/images/likenohover.svg"></button>
                    </li>
                </ul>
            </section>
        </main>
        <footer class="footer">
            <p class="footer__copyright">© 2020 Mesto Russia</p>
        </footer>
    </div>
</body>
</html>
